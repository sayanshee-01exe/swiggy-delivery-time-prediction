name: CI-CD

on: push

jobs:
  CI-CD:
    runs-on: ubuntu-latest

    steps:

      # -------------------------
      # Checkout
      # -------------------------
      - name: Code Checkout
        uses: actions/checkout@v4


      # -------------------------
      # Python setup
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'


      # -------------------------
      # Node setup for the SPA
      # -------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json


      # -------------------------
      # Dependencies
      # -------------------------
      - name: Install Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt


      # -------------------------
      # Build the frontend
      # Runs on every branch so a broken build is caught before merge;
      # only the publish steps below are limited to main.
      # -------------------------
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build


      # -------------------------
      # AWS credentials
      # DVC + ECR are in Sydney
      # -------------------------
      - name: Configure AWS Credentials for ECR and DVC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2


      # -------------------------
      # Get DVC artifacts
      # -------------------------
      - name: DVC Pull
        run: |
          dvc pull


      # -------------------------
      # ML tests
      # -------------------------
      - name: Test Model Registry
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          pytest tests/test_model_registry.py


      - name: Test Model Performance
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          pytest tests/test_model_perf.py


      # -------------------------
      # Promote model
      # -------------------------
      - name: Promote Model
        if: success()
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          python scripts/promote_model_to_prod.py


      # -------------------------
      # ECR Login
      # ECR = ap-southeast-2
      # -------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # -------------------------
      # Build + Push Docker image
      # -------------------------
      - name: Build, tag, and push Docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: latest
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG


      # -------------------------
      # Create CodeDeploy bundle
      # -------------------------
      - name: Zip files for deployment
        if: success()
        run: |
          zip -r deployment.zip \
            appspec.yml \
            deploy/scripts/install_dependencies.sh \
            deploy/scripts/start_docker.sh


      # -------------------------
      # Switch region:
      # CodeDeploy + deployment S3
      # are in us-east-1
      # -------------------------
      - name: Configure AWS Credentials for CodeDeploy
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1


      # -------------------------
      # Publish the SPA
      # Gated on main: the workflow triggers on every push, and an
      # unconditional sync would let any branch overwrite the live site.
      # -------------------------
      - name: Publish frontend to S3
        if: success() && github.ref == 'refs/heads/main'
        run: |
          aws s3 sync frontend/dist "s3://${{ secrets.SPA_BUCKET }}" --delete


      # # Without this, viewers keep serving the previous build from cache.
      # - name: Invalidate CloudFront cache
      #   if: success() && github.ref == 'refs/heads/main'
      #   run: |
      #     aws cloudfront create-invalidation \
      #       --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
      #       --paths "/*"


      # -------------------------
      # Upload deployment bundle
      # -------------------------
      - name: Upload ZIP to S3
        if: success()
        run: |
          aws s3 cp deployment.zip \
            s3://deliverytimepredictdeployment/deployment.zip


      # -------------------------
      # CodeDeploy
      # -------------------------
      - name: Deploy to AWS CodeDeploy
        if: success()
        run: |
          aws deploy create-deployment \
            --application-name deliverytimepred \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --deployment-group-name deliverytimepreddeploymentgrp \
            --s3-location bucket=deliverytimepredictdeployment,key=deployment.zip,bundleType=zip \
            --file-exists-behavior OVERWRITE \
            --region us-east-1